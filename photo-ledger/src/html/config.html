<div class="gbk-config">
  <p>台帳に載せるフィールドを選びます。写真以外は空欄でもかまいません。</p>
  <label>写真（必須）<select id="gbk-photo"></select></label>
  <label>工事名<select id="gbk-project" data-kind="text"></select></label>
  <label>撮影日<select id="gbk-date" data-kind="text"></select></label>
  <label>工種<select id="gbk-work" data-kind="text"></select></label>
  <label>場所・測点<select id="gbk-place" data-kind="text"></select></label>
  <label>説明<select id="gbk-note" data-kind="text"></select></label>
  <label>1ページの枚数<select id="gbk-per-page"><option value="3">3枚</option><option value="2">2枚</option></select></label>
  <p class="gbk-actions"><button type="button" id="gbk-save">保存</button> <button type="button" id="gbk-cancel">キャンセル</button></p>
</div>
